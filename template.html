<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaše E-kniha</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        .page {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* DŮLEŽITÉ: Zde si nastavíte váš obrázek na pozadí */
            background-image: url('https://placehold.co/1240x1754/EFEFEFF/png?text=Váš+obrázek+na+pozadí');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .name-holder {
            font-size: 72px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="name-holder">
            {{NAME}}
        </div>
    </div>
</body>
</html>
